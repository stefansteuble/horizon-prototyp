name = "horizon-prototyp"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# Optional: Leads zusätzlich in KV speichern.
# 1) npx wrangler kv namespace create LEADS
# 2) die ausgegebene id hier eintragen und die Zeilen einkommentieren
# [[kv_namespaces]]
# binding = "LEADS"
# id = "<KV_NAMESPACE_ID>"
