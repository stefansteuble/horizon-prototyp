name = "horizon-prototyp"
main = "src/worker.js"
compatibility_date = "2026-10-01"
# Variablen aus dem Dashboard bei jedem Deploy behalten
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Empfänger der Lead-Mails. Der Resend-Key ist ein Secret und steht nur im Dashboard.
LEAD_EMAIL_TO = "stefan.steuble@ttms.ch"

[observability]
enabled = true

# Optional: Leads zusätzlich in KV speichern.
# 1) npx wrangler kv namespace create LEADS
# 2) die ausgegebene id hier eintragen und die Zeilen einkommentieren
# [[kv_namespaces]]
# binding = "LEADS"
# id = "<KV_NAMESPACE_ID>"
